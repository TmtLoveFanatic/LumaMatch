
<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>LumaMatch</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header>
    <div class="language-switch">
      <button id="jaButton" class="active">日本語</button>
      <button id="enButton">English</button>
    </div>

    <h1>LumaMatch</h1>
    <p id="subtitle"></p>
  </header>

  <main>
    <section>
      <h2 id="heading1"></h2>

      <div class="file-control">
        <label for="imageInput" id="uploadButton" class="upload-button"></label>
        <input type="file" id="imageInput" accept="image/*" hidden>
        <span id="fileName"></span>
      </div>

      <div id="imageArea">
        <p id="imageMessage"></p>
        <canvas id="imageCanvas"></canvas>
      </div>

      <div class="base-color">
        <input type="color" id="baseColor" value="#B64B58">
        <span id="hexValue">#B64B58</span>
      </div>
    </section>

    <section>
      <h2 id="heading2"></h2>
      <div id="palette"></div>
    </section>

    <section>
      <h2 id="heading3"></h2>
      <div id="grayscale"></div>
      <p id="grayDescription"></p>
    </section>
  </main>

  <script src="app.js"></script>
</body>
</html>
